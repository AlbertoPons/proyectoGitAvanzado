name: CI - develop

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Añadir feature al README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Añadir la rama al README
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          line="Añadida feature: $BRANCH_NAME"
          touch README.md

          if ! grep -Fqx "$line" README.md; then
            printf '\n%s\n' "$line" >> README.md
          fi

      - name: Guardar el cambio
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- README.md; then
            echo "El README ya contiene esta feature."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: añade feature $BRANCH_NAME al README"
          git push origin "HEAD:$BRANCH_NAME"

  validate-dev:
    name: Validar DEV_TOKEN
    needs: update-readme
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEV_TOKEN)) {
            throw "DEV_TOKEN no esta configurado o no esta disponible."
          }

          if ([string]::IsNullOrWhiteSpace($env:LOCAL_DEV_TOKEN)) {
            throw "LOCAL_DEV_TOKEN no esta disponible en el runner."
          }

          if ($env:DEV_TOKEN -ne $env:LOCAL_DEV_TOKEN) {
            throw "DEV_TOKEN no coincide con LOCAL_DEV_TOKEN."
          }

          Write-Host "DEV_TOKEN coincide con LOCAL_DEV_TOKEN."
