name: CD - main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    name: Incrementar version del README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Incrementar AppVersion
        if: github.actor != 'github-actions[bot]'
        run: |
          current_version=$(grep -oE '^AppVersion-[0-9]+' README.md | tail -n 1 | cut -d- -f2)

          if [ -z "$current_version" ]; then
            current_version=0
          fi

          next_version=$((current_version + 1))
          timestamp=$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')
          new_line="AppVersion-$next_version - $timestamp"

          if grep -qE '^AppVersion-[0-9]+' README.md; then
            sed -i -E "s/^AppVersion-[0-9]+.*$/$new_line/" README.md
          else
            printf '\n%s\n' "$new_line" >> README.md
          fi

      - name: Guardar el cambio
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No hay cambios de version que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: incrementa AppVersion"
          git push origin "HEAD:$BRANCH_NAME"

  validate-prod:
    name: Validar PROD_TOKEN
    needs: bump-version
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Comparar PROD_TOKEN con LOCAL_PROD_TOKEN
        shell: pwsh
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROD_TOKEN)) {
            throw "PROD_TOKEN no esta configurado o no esta disponible."
          }

          if ([string]::IsNullOrWhiteSpace($env:LOCAL_PROD_TOKEN)) {
            throw "LOCAL_PROD_TOKEN no esta disponible en el runner."
          }

          if ($env:PROD_TOKEN -ne $env:LOCAL_PROD_TOKEN) {
            throw "PROD_TOKEN no coincide con LOCAL_PROD_TOKEN."
          }

          Write-Host "PROD_TOKEN coincide con LOCAL_PROD_TOKEN."
